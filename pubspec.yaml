name: outlive
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  get:
  gradient_borders: ^1.0.4

  permission_handler: ^12.0.3
  flutter_native_contact_picker: ^0.0.12
  http:
  shared_preferences:



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: sfprodisplay
      fonts:
        - asset: assets/fonts/sf_pro_display/regular.otf
          weight: 400
        - asset: assets/fonts/sf_pro_display/medium.otf
          weight: 500
        - asset: assets/fonts/sf_pro_display/bold.otf
          weight: 700

    - family: inter
      fonts:
        - asset: assets/fonts/inter.ttf
